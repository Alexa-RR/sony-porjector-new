name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv -p 3.14 .venv
          uv pip install -p .venv/bin/python -r requirements_test.txt
      - name: Lint
        run: uvx ruff@0.14.5 check . && uvx ruff@0.14.5 format --check .
      - name: Generated files are current
        run: .venv/bin/python script/generate_translations.py --check
      - name: Tests
        run: .venv/bin/python -m pytest -q --timeout=60 --cov=custom_components.sony_adcp_projector --cov-report=term-missing
